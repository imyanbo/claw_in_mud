<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>武侠世界 MUD</title>
  <style>
    @keyframes glow {
      from { text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff; }
      to { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff; }
    }
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
      color: #eee;
      font-family: "KaiTi", "楷体", "SimKai", "STKaiti", "Courier New", monospace;
      margin: 0;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1 {
      text-align: center;
      color: #e94560;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
      margin: 0 0 20px 0;
      font-size: 2em;
      letter-spacing: 4px;
    }
    #game-container {
      flex: 1;
      background: rgba(22, 33, 62, 0.9);
      border: 2px solid #0f3460;
      border-radius: 8px;
      padding: 20px;
      overflow-y: auto;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      white-space: pre-wrap;
      line-height: 1.8;
      font-size: 16px;
      box-shadow: 0 0 20px rgba(233, 69, 96, 0.2);
    }
    #input-area {
      display: flex;
      max-width: 900px;
      margin: 10px auto 0;
      width: 100%;
    }
    #command-input {
      flex: 1;
      padding: 14px;
      font-size: 18px;
      background: rgba(15, 52, 96, 0.8);
      border: 2px solid #0f3460;
      color: #eee;
      border-radius: 4px 0 0 4px;
      font-family: inherit;
    }
    #command-input:focus {
      outline: none;
      border-color: #e94560;
      box-shadow: 0 0 10px rgba(233, 69, 96, 0.4);
    }
    #send-btn {
      padding: 14px 28px;
      background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      border-radius: 0 4px 4px 0;
      font-family: inherit;
      font-weight: bold;
    }
    #send-btn:hover {
      background: linear-gradient(135deg, #ff6b6b 0%, #e94560 100%);
    }
    
    /* 战斗区域特殊样式 */
    .combat {
      color: #ffd700;
      text-shadow: 1px 1px 2px #000;
    }
    .combat-header {
      color: #ff4444;
      font-weight: bold;
      font-size: 18px;
    }
    .combat-win {
      color: #44ff44;
      font-weight: bold;
      font-size: 18px;
    }
    .combat-lose {
      color: #ff4444;
      font-weight: bold;
      font-size: 18px;
    }
    .damage-player {
      color: #ff6b6b;
    }
    .damage-enemy {
      color: #4ecca3;
    }
    .hp-bar {
      color: #ff9f43;
    }
    
    .system { color: #888; }
    .room-title { color: #e94560; font-weight: bold; font-size: 18px; }
    .player-info { color: #4ecca3; }
    .error { color: #ff6b6b; }
    .prompt { color: #ffd700; }
    
    /* 可点击命令样式 */
    .clickable-cmd {
      color: #4ecca3;
      cursor: pointer;
      text-decoration: underline;
      margin: 0 3px;
      transition: color 0.2s;
    }
    .clickable-cmd:hover {
      color: #e94560;
    }
  </style>
</head>
<body>
  <h1>🦞 武侠世界 MUD</h1>
  <div style="max-width:900px;margin:0 auto 10px;width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;color:#9fb3c8;font-size:14px;">
    <div id="version-badge">版本检查中...</div>
    <button id="reset-btn" style="padding:8px 12px;border:none;border-radius:4px;background:#444;color:#fff;cursor:pointer;">清缓存重连</button>
  </div>
  <div id="game-container"></div>
  <div id="input-area">
    <input type="text" id="command-input" placeholder="输入指令..." autocomplete="off">
    <button id="send-btn">发送</button>
  </div>

  <script>
    const container = document.getElementById('game-container');
    const input = document.getElementById('command-input');
    const sendBtn = document.getElementById('send-btn');
    
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const APP_STORAGE_VERSION_KEY = 'mud_app_version';
    const CLIENT_BUILD = 'dev-2026-03-24-1';
    let sessionToken = localStorage.getItem('mud_session');
    let playerName = localStorage.getItem('mud_player');
    let serverVersion = null;
    let ws = null;
    let reconnectAttempts = 0;
    let heartbeatInterval = null;
    const versionBadge = document.getElementById('version-badge');
    const resetBtn = document.getElementById('reset-btn');
    
    // ========== 辅助函数 ==========
    const directionKeywords = ['东', '南', '西', '北', '东北', '东南', '西北', '西南', '上', '下', '前', '后', '左', '右', '进', '出', '入', '返', '回', '去', '来', '折返', '返回'];
    const placeKeywords = ['赌场', '客栈', '武馆', '镖局', '药店', '铁匠铺', '杂货铺']; // 可点击的地名
    const npcPromptTemplate = 'ask __NPC__ about '; 
    
    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function clickableSpan(label, cmd) {
      return '<span class="clickable-cmd" onclick="sendCmd(' + JSON.stringify(cmd).replace(/"/g, '&quot;') + ')">' + escapeHtml(label) + '</span>';
    }
    
    function makeClickable(text) {
      let result = escapeHtml(text);
      // 优先处理地点关键词（精确匹配）
      placeKeywords.forEach(place => {
        const escapedPlace = escapeHtml(place);
        const regex = new RegExp('(' + escapedPlace + ')', 'g');
        result = result.replace(regex, clickableSpan(place, 'go ' + place));
      });
      result = result.replace(/([\u4e00-\u9fa5]+)（([a-zA-Z0-9_]+)）/g, (full, cn, en) => {
        return '<span class="clickable-cmd" onclick="prepareAskNpc(' + JSON.stringify(cn).replace(/"/g, '&quot;') + ')">' + escapeHtml(cn) + '</span>（' + escapeHtml(en) + '）';
      });
      // 处理出口描述中的地点
      result = result.replace(/出口:\s*([^\n<]+)/g, (full, exitsPart) => {
        const exits = exitsPart.split('、').map(x => x.trim()).filter(Boolean);
        const clickable = exits.map(exit => clickableSpan(exit, 'go ' + exit)).join('、');
        return '出口: ' + clickable;
      });
      result = result.replace(/\[play:(\d+)\]/g, (m, num) => clickableSpan('出牌', 'guandan play ' + num));
      // 处理方向关键词
      directionKeywords.forEach(dir => {
        const escapedDir = escapeHtml(dir);
        const regex = new RegExp('(^|[^\\u4e00-\\u9fa5>])(' + escapedDir + ')(?![^<]*>|[\\u4e00-\\u9fa5])', 'g');
        result = result.replace(regex, (m, prefix, word) => prefix + clickableSpan(word, dir));
      });
      return result;
    }
    
    function appendOutput(text, className = '') {
      const div = document.createElement('div');
      
      // 转换所有方向词为可点击
      div.innerHTML = makeClickable(text);
      
      if (className) div.className = className;
      
      // 战斗消息特殊样式
      if (text.includes('战斗') || text.includes('⚔️') || text.includes('🏆') || text.includes('💀')) {
        div.style.cssText = 'color: #ffd700; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 4px; margin: 5px 0; border-left: 3px solid #e94560;';
      }
      if (text.includes('战斗胜利') || text.includes('🏆')) {
        div.style.cssText = 'color: #44ff44; background: rgba(0,50,0,0.3); padding: 10px; border-radius: 4px; margin: 5px 0; border-left: 3px solid #44ff44; font-size: 17px;';
      }
      if (text.includes('战斗落败') || text.includes('💀')) {
        div.style.cssText = 'color: #ff4444; background: rgba(50,0,0,0.3); padding: 10px; border-radius: 4px; margin: 5px 0; border-left: 3px solid #ff4444; font-size: 17px;';
      }
      
      // 三体宇宙线剧情特殊样式 - 科幻感
      if (text.includes('观测天空') || text.includes('解码信号') || text.includes('地外文明') || text.includes('三体') || text.includes('倒计时') || text.includes('深空') || text.includes('半人马座')) {
        div.style.cssText = 'color: #00ffff; background: rgba(0,30,50,0.5); padding: 12px; border-radius: 6px; margin: 8px 0; border-left: 4px solid #00ffff; font-size: 16px; text-shadow: 0 0 5px #00ffff; animation: glow 2s ease-in-out infinite alternate;';
      }
      // 任务开始/更新
      if (text.includes('【任务开始') || text.includes('任务更新')) {
        div.style.cssText = 'color: #ff6b35; background: rgba(30,20,0,0.5); padding: 12px; border-radius: 6px; margin: 8px 0; border-left: 4px solid #ff6b35; font-size: 16px; font-weight: bold;';
      }
      // 阵营选择
      if (text.includes('加入阵营') || text.includes('阵营')) {
        div.style.cssText = 'color: #bf40bf; background: rgba(30,0,40,0.5); padding: 10px; border-radius: 6px; margin: 5px 0; border-left: 3px solid #bf40bf;';
      }
      
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }


    function clearClientState({ keepVersion = false } = {}) {
      localStorage.removeItem('mud_session');
      localStorage.removeItem('mud_player');
      sessionStorage.clear();
      if (!keepVersion) localStorage.removeItem(APP_STORAGE_VERSION_KEY);
      sessionToken = null;
      playerName = null;
    }

    async function ensureVersionFresh() {
      try {
        const resp = await fetch(`/api/version?t=${Date.now()}`, { cache: 'no-store' });
        const data = await resp.json();
        serverVersion = data.serverVersion;
        versionBadge.textContent = `FE:${CLIENT_BUILD} | BE:${data.serverVersion}`;
        const storedVersion = localStorage.getItem(APP_STORAGE_VERSION_KEY);
        if (storedVersion && storedVersion !== data.serverVersion) {
          appendOutput(`检测到新版本 ${data.serverVersion}，已清理旧会话并刷新。`, 'system');
          clearClientState({ keepVersion: true });
          localStorage.setItem(APP_STORAGE_VERSION_KEY, data.serverVersion);
          setTimeout(() => location.reload(), 300);
          return false;
        }
        localStorage.setItem(APP_STORAGE_VERSION_KEY, data.serverVersion);
        return true;
      } catch (err) {
        versionBadge.textContent = `FE:${CLIENT_BUILD} | BE:检查失败`;
        appendOutput('版本检查失败，继续尝试连接。', 'error');
        return true;
      }
    }

    resetBtn.addEventListener('click', () => {
      clearClientState();
      appendOutput('已清理本地缓存与会话，页面即将刷新。', 'system');
      setTimeout(() => location.reload(), 300);
    });

    async function connect() {
      const ok = await ensureVersionFresh();
      if (!ok) return;
      ws = new WebSocket(`${protocol}//${location.host}`);
      
      ws.onopen = () => {
        appendOutput('✓ 连接成功！', 'system');
        reconnectAttempts = 0;
        startHeartbeat();
        // 如果有保存的session，自动恢复登录
        if (sessionToken && playerName) {
          ws.send(`/client_version ${CLIENT_BUILD}`);
          ws.send('/reconnect ' + playerName + ' ' + sessionToken);
        } else {
          ws.send(`/client_version ${CLIENT_BUILD}`);
        }
      };

      ws.onmessage = (event) => {
        // 检查是否包含session token
        if (event.data && event.data.startsWith('【江湖秘术】')) {
          const match = event.data.match(/【江湖秘术】(.+?)又回到了这个世界~/);
          if (match) {
            const name = match[1];
            const token = event.data.split('session:')[1];
            if (token) {
              localStorage.setItem('mud_session', token);
            }
            localStorage.setItem('mud_player', name);
          }
        } else if (event.data && event.data.startsWith('session:')) {
          const token = event.data.substring(8);
          localStorage.setItem('mud_session', token);
          sessionToken = token;
          return;
        } else if (event.data && event.data.startsWith('version:')) {
          serverVersion = event.data.substring(8);
          versionBadge.textContent = `FE:${CLIENT_BUILD} | BE:${serverVersion}`;
          return;
        } else if (event.data && (event.data.includes('客户端版本过旧') || event.data.includes('登录已过期'))) {
          clearClientState({ keepVersion: true });
        }
        appendOutput(event.data);
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        appendOutput('连接出错，请稍候...', 'error');
      };

      ws.onclose = (event) => {
        appendOutput(`连接断开 (code: ${event.code})，正在重连...`, 'error');
        stopHeartbeat();
        // 自动重连
        if (reconnectAttempts < 10) {
          reconnectAttempts++;
          const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
          setTimeout(connect, delay);
        } else {
          appendOutput('重连失败，请刷新页面。', 'error');
        }
      };
    }
    
    function startHeartbeat() {
      // 每60秒发送心跳（带趣味指令）
      heartbeatInterval = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send('/weather');  // 服务端会返回随机趣味内容
        }
      }, 60000);
    }
    
    function stopHeartbeat() {
      if (heartbeatInterval) {
        clearInterval(heartbeatInterval);
        heartbeatInterval = null;
      }
    }
    
    // 初始连接
    connect();

    function sendCommand() {
      const cmd = input.value.trim();
      if (cmd && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(cmd);
        input.value = '';
      }
    }

    sendBtn.addEventListener('click', sendCommand);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendCommand();
    });
    
    // 全局函数：点击命令执行
    window.sendCmd = function(cmd) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(cmd);
        // 显示执行了啥命令
        appendOutput('> ' + cmd, 'system');
      }
    };

    window.prepareAskNpc = function(npcName) {
      input.value = npcPromptTemplate.replace('__NPC__', npcName);
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    };

    input.focus();
  </script>
</body>
</html>
